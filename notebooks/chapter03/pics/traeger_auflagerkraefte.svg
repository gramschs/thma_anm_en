<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="'Libertinus Sans', 'DejaVu Sans', Arial, sans-serif">
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#484949"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#005A94"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E60000"/>
    </marker>
    <marker id="dimArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#484949"/>
    </marker>
  </defs>

  <!-- Hintergrundpanel: sorgt für korrekte Lesbarkeit in hellen und dunklen Themes -->
  <rect x="15" y="15" width="610" height="300" rx="14" fill="#F3F4F4"/>

  <!-- ================= Bemaßung: 1 m / 2 m / 1 m ================= -->
  <g stroke="#484949" stroke-width="1" fill="#484949" font-size="12">
    <!-- Hilfslinien von den Kraftangriffs-/Lagerpunkten -->
    <line x1="140" y1="210" x2="140" y2="245" stroke-dasharray="2,2"/>
    <line x1="220" y1="168" x2="220" y2="245" stroke-dasharray="2,2"/>
    <line x1="380" y1="168" x2="380" y2="245" stroke-dasharray="2,2"/>
    <line x1="460" y1="224" x2="460" y2="245" stroke-dasharray="2,2"/>

    <line x1="141" y1="238" x2="219" y2="238" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
    <text x="180" y="233" text-anchor="middle">1 m</text>

    <line x1="221" y1="238" x2="379" y2="238" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
    <text x="300" y="233" text-anchor="middle">2 m</text>

    <line x1="381" y1="238" x2="459" y2="238" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
    <text x="420" y="233" text-anchor="middle">1 m</text>

    <!-- Gesamtlänge L = 4 m -->
    <line x1="140" y1="245" x2="140" y2="280" stroke-dasharray="2,2"/>
    <line x1="460" y1="245" x2="460" y2="280" stroke-dasharray="2,2"/>
    <line x1="141" y1="273" x2="459" y2="273" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
    <text x="300" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#484949">L = 4 m</text>
  </g>

  <!-- ================= Lager A: Festlager ================= -->
  <g stroke="#484949" stroke-width="1.5" fill="none">
    <polygon points="140,168 122,198 158,198" fill="#CCDEE9"/>
    <line x1="104" y1="198" x2="176" y2="198"/>
    <g stroke-width="1.2">
      <line x1="108" y1="198" x2="98" y2="210"/>
      <line x1="120" y1="198" x2="110" y2="210"/>
      <line x1="132" y1="198" x2="122" y2="210"/>
      <line x1="144" y1="198" x2="134" y2="210"/>
      <line x1="156" y1="198" x2="146" y2="210"/>
      <line x1="168" y1="198" x2="158" y2="210"/>
    </g>
    <circle cx="140" cy="168" r="4" fill="#F3F4F4"/>
  </g>

  <!-- ================= Lager B: Loslager ================= -->
  <g stroke="#484949" stroke-width="1.5" fill="none">
    <polygon points="460,168 442,198 478,198" fill="#CCDEE9"/>
    <circle cx="450" cy="205" r="5" fill="#CCDEE9"/>
    <circle cx="470" cy="205" r="5" fill="#CCDEE9"/>
    <line x1="424" y1="212" x2="496" y2="212"/>
    <g stroke-width="1.2">
      <line x1="428" y1="212" x2="418" y2="224"/>
      <line x1="440" y1="212" x2="430" y2="224"/>
      <line x1="452" y1="212" x2="442" y2="224"/>
      <line x1="464" y1="212" x2="454" y2="224"/>
      <line x1="476" y1="212" x2="466" y2="224"/>
      <line x1="488" y1="212" x2="478" y2="224"/>
    </g>
  </g>

  <!-- ================= Träger ================= -->
  <rect x="140" y="152" width="320" height="16" fill="#CCDEE9" stroke="#484949" stroke-width="1.5"/>

  <!-- ================= Koordinatensystem in A ================= -->
  <g stroke="#484949" stroke-width="1.3">
    <line x1="140" y1="160" x2="190" y2="160" marker-end="url(#arrowGray)"/>
    <line x1="140" y1="160" x2="140" y2="92" marker-end="url(#arrowGray)"/>
  </g>
  <text x="197" y="164" font-size="13" fill="#484949">x</text>
  <text x="135" y="86" font-size="13" fill="#484949" text-anchor="middle">y</text>
  <circle cx="140" cy="160" r="2.2" fill="#484949"/>

  <!-- ================= Punktlabel A und B ================= -->
  <text x="117" y="146" font-size="14" font-weight="bold" fill="#005A94" text-anchor="middle">A</text>
  <text x="460" y="146" font-size="14" font-weight="bold" fill="#005A94" text-anchor="middle">B</text>

  <!-- ================= Seilkraft bei 1 m ================= -->
  <g stroke="#484949" stroke-width="1" stroke-dasharray="3,3" fill="none">
    <line x1="220" y1="160" x2="256" y2="160"/>
    <line x1="256" y1="160" x2="256" y2="112"/>
  </g>
  <line x1="220" y1="160" x2="256" y2="112" stroke="#005A94" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <text x="238" y="185" font-size="11.5" fill="#484949" text-anchor="middle">6 kN</text>
  <text x="271" y="138" font-size="11.5" fill="#484949">8 kN</text>
  <text x="256" y="100" font-size="13" font-weight="bold" fill="#005A94" text-anchor="middle">Seilkraft</text>

  <!-- ================= Last F bei 3 m ================= -->
  <line x1="380" y1="160" x2="380" y2="222" stroke="#E60000" stroke-width="2.2" marker-end="url(#arrowRed)"/>
  <text x="392" y="196" font-size="13" font-weight="bold" fill="#E60000">F = 12 kN</text>

</svg>
